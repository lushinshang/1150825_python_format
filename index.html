<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 排版轉換器</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --muted: #999;
    --accent: #4fc3f7;
    --accent-hover: #29b6f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", Consolas, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    max-width: 560px;
    padding: 40px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
  }
  p.desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 32px;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  a.btn.primary {
    background: var(--accent);
    color: #111;
  }
  a.btn.primary:hover { background: var(--accent-hover); }
  a.btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  a.btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
  .hint {
    margin-top: 24px;
    font-size: 12px;
    color: #666;
    line-height: 1.6;
  }
</style>
</head>
<body>
<main>
  <h1>Python 排版轉換器</h1>
  <p class="desc">貼上 Python 程式碼，用瀏覽器內建的 black 排版並語法高亮顯示。<br>單一 HTML 檔案，不依賴任何外部網路資源，可在線上使用，也可下載後完全離線使用。</p>
  <div class="actions">
    <a class="btn primary" href="python_format.html">線上開啟使用</a>
    <a class="btn secondary" href="python_format.html" download="python_format.html">下載離線版</a>
  </div>
  <p class="hint">下載後雙擊打開 python_format.html 即可離線使用，不需要網路連線、不需要安裝 Python 環境。</p>
</main>
</body>
</html>
