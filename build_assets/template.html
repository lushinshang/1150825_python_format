  button.secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  main {
    flex: 1;

  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-header {
    padding: 8px 14px;
    font-size: 12px;

    border-bottom: 1px solid var(--border);
    display: flex;

    flex: 1;

  .output-wrap pre {
    margin: 0 !important;
    height: 100%;

    line-height: 1.6 !important;
  }
  #errorBox {
    display: none;
    padding: 10px 14px;
    background: #3a1d1d;

<script>
// ------------------------------------------------------------------
// 內嵌資產：Pyodide runtime 執行期需要的二進位檔案（wasm / stdlib / lock file / wheels）
// 全部以 base64 內嵌，透過覆寫 window.fetch 攔截，讓 Pyodide 誤以為是正常網路請求。
// ------------------------------------------------------------------
const EMBEDDED_ASSETS = {
%%EMBEDDED_ASSETS_JSON%%
};

function base64ToBytes(base64) {
  const binStr = atob(base64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

const nativeFetch = window.fetch.bind(window);
window.fetch = function (input, init) {
  let url;
  if (typeof input === 'string') url = input;
  else if (input && input.url) url = input.url;
  else url = String(input);

  const filename = url.split('/').pop().split('?')[0];
  const asset = EMBEDDED_ASSETS[filename];
  if (asset) {
    const bytes = base64ToBytes(asset.data);
    return Promise.resolve(new Response(bytes, {
      status: 200,
      statusText: 'OK',
      headers: { 'Content-Type': asset.type }
    }));
  }
  return nativeFetch(input, init);
};
</script>

<script>
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('errorBox');
const inputEl = document.getElementById('input');
const outputEl = document.getElementById('output');
const formatBtn = document.getElementById('formatBtn');
const sampleBtn = document.getElementById('sampleBtn');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');

const SAMPLE = `import os,sys
def   foo(a,b ,   c=1):
    x={'a':1,'b':2,'c':3}
    if a==1:
        print( "hello" ,a,b,c)
    return [i for i in range(10) if i%2==0]

class Bar:
    def __init__(self,name):
        self.name=name
    def greet(self):
        return f"hi {self.name}"
`;

let pyodidePromise = null;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function showError(msg) {
  if (!msg) {
    errorBox.classList.remove('show');
    errorBox.textContent = '';
    return;
  }
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

const WHEEL_BASE = 'https://offline.local/wheels/';
const WHEEL_FILES = [
  'click-8.4.2-py3-none-any.whl',
  'mypy_extensions-1.1.0-py3-none-any.whl',
  'pathspec-1.1.1-py3-none-any.whl',
  'platformdirs-4.11.4-py3-none-any.whl',
  'pytokens-0.4.1-py3-none-any.whl',
  'black-26.5.1-py3-none-any.whl',
];

async function getPyodide() {
  if (pyodidePromise) return pyodidePromise;
  pyodidePromise = (async () => {
    formatBtn.disabled = true;
    setStatus('初始化 Python 執行環境中...');
    const pyodide = await loadPyodide({ indexURL: 'https://offline.local/pyodide/' });
    setStatus('安裝 black 排版套件中...');
    await pyodide.loadPackage('micropip');
    const micropip = pyodide.pyimport('micropip');
    await micropip.install(WHEEL_FILES.map(f => WHEEL_BASE + f), { deps: false });
    setStatus('就緒，可以開始格式化', 'ok');
    formatBtn.disabled = false;
    return pyodide;
  })();
  return pyodidePromise;
}

async function formatCode() {
  const src = inputEl.value;
  if (!src.trim()) {
    showError('請先貼上程式碼。');
    return;
  }
  formatBtn.disabled = true;
  showError(null);
  try {
    const pyodide = await getPyodide();
    setStatus('格式化中...');
    pyodide.globals.set('__src', src);
    const resultStr = await pyodide.runPythonAsync(`
import black, json
try:
    __formatted = black.format_str(__src, mode=black.Mode())
    __result = json.dumps({"ok": True, "code": __formatted})
except Exception as e:
    __result = json.dumps({"ok": False, "error": str(e)})
__result
`);
    const result = JSON.parse(resultStr);
    if (result.ok) {
      outputEl.textContent = result.code;
      Prism.highlightElement(outputEl);
      setStatus('格式化完成', 'ok');
    } else {
      showError('black 排版失敗（通常表示程式碼有語法錯誤）：\n' + result.error);
      setStatus('格式化失敗', 'error');
    }
  } catch (e) {
    showError('執行錯誤：' + e.message);
    setStatus('發生錯誤', 'error');
  } finally {
    formatBtn.disabled = false;
  }
}

formatBtn.addEventListener('click', formatCode);

sampleBtn.addEventListener('click', () => {
  inputEl.value = SAMPLE;
});

copyBtn.addEventListener('click', async () => {
  const text = outputEl.textContent;
  if (!text) return;
  await navigator.clipboard.writeText(text);
  const old = copyBtn.textContent;
  copyBtn.textContent = '已複製！';
  setTimeout(() => copyBtn.textContent = old, 1200);
});

downloadBtn.addEventListener('click', () => {
  const text = outputEl.textContent;
  if (!text) return;
  const blob = new Blob([text], { type: 'text/x-python' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'formatted.py';
  a.click();
  URL.revokeObjectURL(url);
});

getPyodide().catch(e => {
  setStatus('Python 執行環境初始化失敗：' + e.message, 'error');
});
</script>
